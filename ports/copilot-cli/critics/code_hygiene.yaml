# ─── OUTPUT SCHEMA ───────────────────────────────────────────────────────────

output_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [severity, description, evidence_tool, evidence_result]
        properties:
          severity:
            type: string
            enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
          description:
            type: string
          evidence_tool:
            type: string
            description: "How verified: grep, schema, read, analysis, pre-screen"
          evidence_result:
            type: string
            description: "Actual excerpt or output proving this finding"
          location:
            type: string
            description: "Where in the artifact (section, line, key path)"
          rubric_criterion:
            type: string
            description: "Rubric criterion ID this finding addresses"
          category:
            type: string
            description: "Evaluation category (CAT-01 through CAT-12, AP-01 through AP-06)"
