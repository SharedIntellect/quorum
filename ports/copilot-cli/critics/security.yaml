# ─── DELEGATION BOUNDARY ─────────────────────────────────────────────────────
# Other critics that interact with this one.

delegation:
  receives_from:
    - critic: code_hygiene
      patterns: ["eval/exec usage", "Invoke-Expression", "hardcoded credentials", "prompt injection vectors"]
      note: >
        Code Hygiene flags these patterns for traceability and delegates
        security severity assessment to this critic. This critic assigns
        the authoritative severity and remediation.

# ─── OUTPUT SCHEMA ───────────────────────────────────────────────────────────

output_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [severity, description, evidence_tool, evidence_result]
        properties:
          severity:
            type: string
            enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
          description:
            type: string
          evidence_tool:
            type: string
            description: "How verified: grep, schema, read, analysis, pre-screen"
          evidence_result:
            type: string
            description: "Actual excerpt or output proving this finding"
          location:
            type: string
            description: "Where in the artifact (section, line, key path)"
          rubric_criterion:
            type: string
            description: "Rubric criterion ID this finding addresses"
          framework_references:
            type: object
            properties:
              asvs:
                type: string
                description: "ASVS 5.0.0 section reference"
              cwe:
                type: string
                description: "CWE ID and name"
              nist:
                type: string
                description: "NIST SP 800-53 SA-11 sub-control"
              detection_method:
                type: string
                enum: [sast_prescreen, llm_semantic, both]
